[package]
name = "cloud-gaming"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
adamo = { version = "1.0.31", features = ["video", "audio", "gstreamer", "google-bbr3"] }
clap = { version = "4", features = ["derive"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
inputtino = { git = "https://github.com/games-on-whales/inputtino.git", branch = "stable" }
keycode = "1"
libc = "0.2"
reis = "0.7"
x11rb = { version = "0.13", features = ["xfixes"] }

[workspace]
members = ["mobile/core"]
