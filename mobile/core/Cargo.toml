[package]
name = "adamo-play"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
adamo = { path = "../../../adamo", features = ["audio"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32", features = ["cli"] }
