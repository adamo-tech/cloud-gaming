name: AdamoPlay
options:
  bundleIdPrefix: com.adamo
  deploymentTarget:
    iOS: "17.0"
targets:
  AdamoPlay:
    type: application
    platform: iOS
    sources:
      - AdamoPlay
      - Generated/adamo_play.swift
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Adamo Play
        LSApplicationCategoryType: public.app-category.games
        NSLocalNetworkUsageDescription: Adamo Play connects to your gaming PC on your network.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamo.play
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/adamo_playFFI.modulemap
        OTHER_LDFLAGS[sdk=iphoneos*]: $(SRCROOT)/../../target/aarch64-apple-ios/release/libadamo_play.a
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(SRCROOT)/../../target/aarch64-apple-ios-sim/release/libadamo_play.a
    preBuildScripts:
      - name: Build Rust core
        script: ../build-core.sh "$PLATFORM_NAME"
        basedOnDependencyAnalysis: false
